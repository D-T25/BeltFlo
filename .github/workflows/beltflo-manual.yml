name: BeltFlo Manual Build

on:
  push:
    branches:
      - beltflo-esp32-conversion
    paths:
      - "BeltFlo/Help/BeltFlo User Manual.md"
      - "BeltFlo/Help/BeltFlo User Manual.html"
      - ".github/workflows/beltflo-manual.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beltflo-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install PDF renderer
        run: python -m pip install --disable-pip-version-check weasyprint

      - name: Build and sync manual
        shell: bash
        run: |
          mkdir -p BeltFloApp/Help
          cp "BeltFlo/Help/BeltFlo User Manual.md" "BeltFloApp/Help/BeltFlo User Manual.md"
          cp "BeltFlo/Help/BeltFlo User Manual.html" "BeltFloApp/Help/BeltFlo User Manual.html"
          python - <<'PY'
          from weasyprint import HTML
          HTML(filename="BeltFlo/Help/BeltFlo User Manual.html").write_pdf(
              "BeltFlo/Help/BeltFlo User Manual.pdf"
          )
          PY
          cp "BeltFlo/Help/BeltFlo User Manual.pdf" "BeltFloApp/Help/BeltFlo User Manual.pdf"

      - name: Commit generated PDF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "BeltFlo/Help/BeltFlo User Manual.pdf" \
                  "BeltFloApp/Help/BeltFlo User Manual.md" \
                  "BeltFloApp/Help/BeltFlo User Manual.html" \
                  "BeltFloApp/Help/BeltFlo User Manual.pdf"
          if git diff --cached --quiet; then
            echo "Manual already up to date."
          else
            git commit -m "Rebuild BeltFlo user manual PDF"
            git push
          fi
