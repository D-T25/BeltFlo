name: BeltFlo Windows Build

on:
  push:
    paths:
      - "BeltFlo/**"
      - "ModuleSimulator/**"
      - "BeltFlo.LogicTests/**"
      - "BeltFlo.sln"
      - ".github/workflows/beltflo-windows-build.yml"
  pull_request:
    paths:
      - "BeltFlo/**"
      - "ModuleSimulator/**"
      - "BeltFlo.LogicTests/**"
      - "BeltFlo.sln"
      - ".github/workflows/beltflo-windows-build.yml"
  workflow_dispatch:

concurrency:
  group: beltflo-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore packages
        run: |
          dotnet restore BeltFlo.sln
          dotnet restore BeltFlo.LogicTests/BeltFlo.LogicTests.csproj

      - name: Build Release
        run: |
          dotnet build BeltFlo.sln -c Release --no-restore
          dotnet build BeltFlo.LogicTests/BeltFlo.LogicTests.csproj -c Release --no-restore

      - name: Run logic and protocol tests
        shell: pwsh
        run: |
          & ".\BeltFlo.LogicTests\bin\Release\net48\BeltFlo.LogicTests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: List application output
        shell: pwsh
        run: |
          Get-ChildItem BeltFloApp -Recurse | Select-Object FullName, Length

      - name: Upload BeltFlo application
        uses: actions/upload-artifact@v4
        with:
          name: BeltFlo-Windows-Release
          path: BeltFloApp/**
          if-no-files-found: error
